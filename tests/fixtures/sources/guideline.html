<body>
  <nav><a href="#dosing">Dosing</a></nav>
  <h1>Dosing</h1>
  <p>Give the standard dose
     once a day with food.</p>
  <h2>Renal impairment</h2>
  <p>Reduce the dose by half when clearance falls below 30 mL/min.</p>
  <ul>
    <li>Check clearance before the first dose.</li>
    <li>Recheck every three months.</li>
  </ul>
</body>
